<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced School Management System</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Optional: Add Favicon -->
    <!-- <link rel="icon" href="favicon.ico" type="image/x-icon"> -->
</head>
<body>
    <!-- Login Screen -->
    <div id="loginContainer">
        <form id="loginForm">
            <h2>School Portal Login</h2>
            <!-- Added Labels for Accessibility and Styling -->
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username (e.g., admin)" required>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password (e.g., admin)" required>
            <button type="submit">Login</button>
            <p class="login-hint">Hint: Use admin / admin</p>
        </form>
    </div>

    <!-- Main Application (Initially Hidden) -->
    <div id="mainApp" style="display:none;">
        <header class="main-header">
            <h1>School Management System</h1>
            <!-- Optional: Add logo or user info here -->
        </header>
        <nav>
            <ul>
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#students">Students</a></li>
                <li><a href="#teachers">Teachers</a></li>
                <li><a href="#classes">Classes</a></li>
                <li><a href="#fees">Fee Management</a></li>
                <li><a href="#marks">Marks Evaluation</a></li>
                <li><a href="#results">Results</a></li>
                <li><a href="#attendance">Attendance</a></li> <!-- <<< Added Attendance Link -->
            </ul>
        </nav>
        <!-- Content Area -->
        <main id="app">
            <!-- Content will be loaded here by JavaScript -->
        </main>

        <footer class="main-footer">
            <p>© 2023 School Management System. All rights reserved.</p>
        </footer>
    </div>

    <!-- <<< New Attendance History Modal >>> -->
    <div id="attendanceHistoryModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-button" onclick="closeAttendanceHistoryModal()">×</span>
            <h2 id="modalStudentName">Attendance History</h2>
            <p id="modalMonthYear"></p>
            <div id="modalHistoryContent" class="modal-history-grid">
                <!-- History details will be loaded here by JS -->
            </div>
        </div>
    </div>
    <!-- <<< End Attendance History Modal >>> -->


    <script src="app.js"></script>

</body>
</html>
